<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <form action="/submit" method="POST">
        <input type="text" name="name" placeholder="enter you name here" required>

        <p>select your language of choice</p>
        <input type="radio" value="java" id="radio-java"><label for="radio-java">Java</label>
        <input type="radio" value="java" id="radio-python"><label for="radio-python">Python</label>
        <hr>


        <textarea id="message" name="message" rows="1" cols="10" placeholder="Write your message..."></textarea>
        <select multiple size="2">
            <option value="none" selected>none selected</option>
            <option value="apple">apple</option>
            <option value="apple">banana</option>
            <option value="apple">cherry</option>
        </select>
        <select name="course">
    <select name="course">
        <optgroup label="Frontend">
            <option value="html">HTML</option>
            <option value="css">CSS</option>
        </optgroup>
        <optgroup label="Backend">
            <option value="node">Node.js</option>
            <option value="python">Python</option>
        </optgroup>
    </select>
        <button type="submit" disabled aria-disabled="true">submit form</button>
    </form>

</html>
