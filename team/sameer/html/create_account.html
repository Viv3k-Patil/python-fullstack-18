<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

</head>
<body>
<form>
  <h2>Create Account</h2>
   <link rel="stylesheet" href="create_account.css">
  <label>Full Name</label><br>
  <input type="text" placeholder="Enter your full name" required><br><br>

  <p>Gender</p>
    <label><input type="radio" name="gender" value="male"> Male</label>
    <label><input type="radio" name="gender" value="female"> Female</label>
    <label><input type="radio" name="gender" value="other"> Other</label><br><br>

  <label>Email Address</label><br>
  <input type="email" placeholder="Enter your email" required><br><br>

  <label for="phone">Phone Number</label><br>
  <input type="tel" id="phone" name="phone" placeholder=" 9175917009" required="int"><br><br>

  <label>Username</label><br>
  <input type="text" placeholder="Choose a username" required><br><br>

  <label>Password</label><br>
  <input type="password" placeholder="Create a password" required><br><br>

  <label>Confirm Password</label><br>
  <input type="password" placeholder="Repeat your password" required><br><br>

  <button type="submit">Sign Up</button>
</form>
</body>
</html>
