<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <fieldset>
        <legend>Interview Details</legend>
        <form>
            <h2>Interview Schedule</h2>

  <label for="avatar">Profile Picture</label><br>
  <input type="file" id="avatar" name="avatar" accept="image/*"><br><br>


  <label>Name</label><br>
  <input type="text" value="sameer awate" disabled><br><br>

  <label>Skills</label><br>
  <input type="text" placeholder="e.g. Python, FastAPI"><br><br>

  <label>Date Required</label><br>
  <input type="date"><br><br>

  <label>Time</label><br>
  <input type="time"><br><br>

  <label>Campus</label><br>
  <input type="radio" id="aundh" name="campus" value="Aundh">
  <label for="aundh">Aundh</label><br>
  
  <input type="radio" id="wakad" name="campus" value="Wakad">
  <label for="wakad">Wakad</label><br>
  
  <input type="radio" id="parihar" name="campus" value="Parihar chowk">
  <label for="parihar">Parihar chowk</label><br><br>

  <label>Batch</label><br>
  <select name="batch">
    <option value="" disabled selected>Select a batch</option>
    <option value="17">Batch 17</option>
    <option value="18">Batch 18</option>
    <option value="19">Batch 19</option>
  </select><br><br>

  <label>Resume</label><br>
  <input type="file"><br><br>

  <button type="submit">Submit</button>
</form>
</fieldset>
</body>
</html>
