<!DOCTYPE html>
<html>
<head>
    <title>CSS Types Example</title>

    <!-- INTERNAL CSS -->
    <style>
        .internal {
            color: red;
            font-size: 24px;
        }
    </style>

    <!-- EXTERNAL CSS -->
    <link rel="stylesheet" href="index.css">

</head>

<body>

    <h1>CSS Types Example</h1>

    <!-- INLINE CSS -->
    <p style="color: blue; font-size: 22px;">
        This paragraph uses Inline CSS.
    </p>

    <!-- INTERNAL CSS -->
    <p class="internal">
        This paragraph uses Internal CSS.
    </p>

    <!-- EXTERNAL CSS -->
    <p class="external">
        This paragraph uses External CSS.
    </p>

</body>
</html>
