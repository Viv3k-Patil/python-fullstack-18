<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        button{
            cursor: pointer;
        }
    </style>
</head>
<body>

    <p id="pass">this is my password</p>
    
    <!-- The onclick attribute hides the element -->
    <button onclick="document.getElementById('pass').style.display='none'">
        hide password
    </button>

</body>
</html>
